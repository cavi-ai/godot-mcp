name: Checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
      - run: uv sync --locked --dev
      - name: Install the newest stable Godot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo godotengine/godot --dir "$RUNNER_TEMP/godot" \
            --pattern 'Godot_v*-stable_linux.x86_64.zip' --pattern SHA512-SUMS.txt
          cd "$RUNNER_TEMP/godot"
          grep -E '  Godot_v[^ ]+-stable_linux\.x86_64\.zip$' SHA512-SUMS.txt | sha512sum --check --strict
          unzip -q Godot_v*-stable_linux.x86_64.zip
          echo "CAVI_GODOT_BIN=$(echo "$RUNNER_TEMP"/godot/Godot_v*-stable_linux.x86_64)" >> "$GITHUB_ENV"
      - run: uv run --locked python -m unittest discover -s tests
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv build
      - name: Build MCP evaluator
        run: |
          uv run --locked python evals/evaluator.py build --root "$RUNNER_TEMP/mcp-eval" --branch main
          echo "MCPEVAL_EXECUTABLE=$RUNNER_TEMP/mcp-eval/bin/mcpeval" >> "$GITHUB_ENV"
          mkdir -p .tmp/evals/evaluator
          cp "$RUNNER_TEMP/mcp-eval/"{build-record.json,build.stdout,build.stderr,version.stdout,version.stderr,.crates2.json} .tmp/evals/evaluator/
      - run: uv run --locked python evals/run.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: godot-mcp-evaluation
          path: .tmp/evals/
          include-hidden-files: true
          if-no-files-found: ignore

  pin-consumers:
    needs: [checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions: {}
    uses: cavi-ai/mcp-core/.github/workflows/pin-consumers.yml@main
    with:
      consumers: '["game-art-pipeline"]'
    secrets:
      token: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
