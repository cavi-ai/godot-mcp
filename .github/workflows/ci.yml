name: Checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
      - run: uv sync --locked --dev
      - run: uv run --locked python -m unittest discover -s tests
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv build
      - name: Build MCP evaluator
        run: |
          uv run --locked python evals/evaluator.py build --root "$RUNNER_TEMP/mcp-eval" --branch main
          echo "MCPEVAL_EXECUTABLE=$RUNNER_TEMP/mcp-eval/bin/mcpeval" >> "$GITHUB_ENV"
          mkdir -p .tmp/evals/evaluator
          cp "$RUNNER_TEMP/mcp-eval/"{build-record.json,build.stdout,build.stderr,version.stdout,version.stderr,.crates2.json} .tmp/evals/evaluator/
      - run: uv run --locked python evals/run.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: godot-mcp-evaluation
          path: .tmp/evals/
          include-hidden-files: true
          if-no-files-found: ignore

  pin-consumers:
    needs: [checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require CONSUMER_DISPATCH_TOKEN
        env:
          TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
        run: test -n "$TOKEN" || { echo "::error::Add the CONSUMER_DISPATCH_TOKEN repository secret"; exit 1; }
      - name: Dispatch server-merged to game-art-pipeline
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
        run: gh api repos/cavi-ai/game-art-pipeline/dispatches --method POST -f event_type=server-merged
