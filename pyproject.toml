[project]
name = "cavi-godot-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp>=2,<3"]

[project.scripts]
cavi-godot-mcp = "godot_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
godot_mcp = ["runtime/*"]
