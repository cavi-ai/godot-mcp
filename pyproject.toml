[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cavi-godot-mcp"
version = "0.1.0"
description = "Local MCP tools for reviewing static Godot assets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "CAVI AI"}]
requires-python = ">=3.15"
dependencies = ["anyio>=4.5,<5", "cavi-mcp-core>=0.1.3,<0.2", "mcp>=2.3,<3"]

[project.scripts]
cavi-godot-mcp = "godot_mcp.server:main"

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["godot_mcp*"]
namespaces = true

[tool.setuptools.package-data]
godot_mcp = ["runtime/*"]

[tool.ruff]
target-version = "py315"
